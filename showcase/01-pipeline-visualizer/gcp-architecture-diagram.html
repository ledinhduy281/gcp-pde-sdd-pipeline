<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Cloud Platform — Excelerate-Jinder Architecture Diagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .diagram-canvas {
      position: relative;
      width: 100%;
      max-width: 1560px;
      background: #f8f9fa;
      border: 1px solid #e0e0e0;
    }
    .anim-toggle-btn {
      position: absolute;
      top: 14px;
      right: 36px;
      background: #ffffff;
      border: 1px solid #dadce0;
      color: #1a73e8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.1);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .anim-toggle-btn:hover {
      background: #f1f3f4;
      border-color: #1a73e8;
    }
    .anim-toggle-btn.active {
      background: #e8f0fe;
      border-color: #1a73e8;
    }
    @keyframes dashFlow {
      to {
        stroke-dashoffset: -40;
      }
    }
    .flowing-line {
      stroke-dasharray: 8, 6 !important;
      stroke-width: 2.4px !important;
      animation: dashFlow 0.9s linear infinite;
    }
  </style>
</head>

  <script>
    (function () {
      let isAnimating = true;
      const btn = document.getElementById("btn-toggle-anim");
      const paths = document.querySelectorAll("#gcp-arch-svg path[marker-end]");

      function applyState() {
        paths.forEach((p) => p.classList.toggle("flowing-line", isAnimating));
        btn.textContent = isAnimating ? "Pause Flow Animation" : "Play Flow Animation";
        btn.classList.toggle("active", isAnimating);
      }

      btn.addEventListener("click", () => {
        isAnimating = !isAnimating;
        applyState();
      });

      applyState();
    })();
  </script>
